[package]
name = "text-to-speech"
version = "0.7.1"
description = "Text to speech reader"
authors = ["Ciro Cesar Maciel"]
edition = "2021"

[lib]
name = "text_to_speech_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
rand = "0.8"
arboard = "3"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
piper-rs = { git = "https://github.com/thewh1teagle/piper-rs", branch = "main" }
ort = "=2.0.0-rc.11"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
bytes = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
