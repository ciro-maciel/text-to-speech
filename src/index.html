<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Speech</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="player">
      <header class="player__head">
        <span class="label"><span id="state">Lendo</span><span class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span>
        <span class="player__progress" id="progress"></span>
      </header>

      <div class="tele" aria-live="off">
        <p class="tele__side" id="prev"></p>
        <p class="tele__now" id="now"></p>
        <p class="tele__side" id="next"></p>
      </div>

      <div class="track" aria-hidden="true"><span id="bar"></span></div>

      <footer class="player__foot">
        <span class="player__clock" id="clock"></span>
        <span class="player__meta"><span id="chip-engine">Internet</span> · <span id="chip-voice">Rafael</span> · <span id="chip-speed">1,00×</span></span>
        <span class="player__keys"><kbd class="kbd">Espaço</kbd> continuar <kbd class="kbd">←</kbd><kbd class="kbd">→</kbd> trecho</span>
        <span class="player__hint" id="hint"></span>
      </footer>
    </div>
  </body>
</html>
