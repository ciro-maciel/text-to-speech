<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="settings.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Speech</title>
    <script type="module" src="/settings.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="drag" data-tauri-drag-region></div>
        <p class="word" data-tauri-drag-region>Text to Speech</p>
        <nav class="groups" aria-label="Sections" data-i18n-aria="sections">
          <div class="group">
            <p class="label" data-i18n="groupReading">Reading</p>
            <button type="button" data-tab="shortcut" aria-pressed="true"><svg class="i"><use href="icons.svg#keyboard"/></svg><span data-i18n="tabShortcut">Shortcut</span></button>
            <button type="button" data-tab="voice"><svg class="i"><use href="icons.svg#volume"/></svg><span data-i18n="tabVoice">Voice</span></button>
          </div>
          <div class="group">
            <p class="label" data-i18n="groupSettings">Settings</p>
            <button type="button" data-tab="player"><svg class="i"><use href="icons.svg#layout-navbar"/></svg><span data-i18n="tabPlayer">Player</span></button>
            <button type="button" data-tab="system"><svg class="i"><use href="icons.svg#device-desktop"/></svg><span data-i18n="tabSystem">System</span></button>
          </div>
        </nav>
        <footer class="foot">
          <button type="button" class="status" id="status-line" hidden><svg class="i"><use href="icons.svg#check"/></svg><span></span></button>
          <p class="ver" id="version"></p>
        </footer>
      </aside>

      <main class="main">
        <!-- SHORTCUT -->
        <section class="pane" data-tab="shortcut">
          <header class="ph">
            <div class="ph-text">
              <p class="label">Text to Speech</p>
              <h1 data-i18n="shortcutTitle">Shortcut</h1>
              <p class="sub" data-i18n="shortcutSub"></p>
            </div>
          </header>
          <div class="rows">
            <div class="row">
              <span data-i18n="readSelection">Read the selection<small id="shortcut-hint" data-i18n="shortcutHint"></small></span>
              <span class="ctl">
                <input class="inp inline key" id="speak-input" type="text" readonly aria-label="Shortcut to read the selection" data-i18n-aria="readSelectionAria" />
                <button class="lnk" id="reset-shortcut" type="button" data-i18n="resetShortcut">Default</button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="stopReading">Stop reading<small data-i18n="stopReadingHint"></small></span>
              <span class="kbd">Esc</span>
            </div>
          </div>
        </section>

        <!-- VOICE -->
        <section class="pane" data-tab="voice" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Text to Speech</p>
              <h1 data-i18n="voiceTitle">Voice</h1>
              <p class="sub" data-i18n="voiceSub"></p>
            </div>
            <button class="btn" id="test-voice" type="button"><svg class="i"><use id="test-icon" href="icons.svg#player-play"/></svg><span id="test-label">Hear the voice</span></button>
          </header>
          <div class="rows">
            <div class="row">
              <span data-i18n="engine">Engine<small data-i18n="engineHint"></small></span>
              <span class="seg" role="group" aria-label="Engine" data-i18n-aria="engine">
                <button type="button" data-engine="rafael">Rafael</button>
                <button type="button" data-engine="piper">Piper</button>
              </span>
            </div>
            <div class="row" id="piper-voice-field" hidden>
              <span data-i18n="piperVoice">Voice<small id="piper-status"></small></span>
              <span class="ctl">
                <select class="sel" id="piper-voice" aria-label="Piper voice" data-i18n-aria="piperVoiceAria"></select>
                <button class="lnk" id="piper-download" type="button" hidden data-i18n="download">Download</button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="speed">Speed<small id="speed-hint"></small></span>
              <span class="ctl">
                <input type="range" id="speed" min="0.5" max="2.0" step="0.05" value="1.0" aria-label="Speed" data-i18n-aria="speed" />
                <span class="value" id="speed-value">1.00×</span>
              </span>
            </div>
          </div>
        </section>

        <!-- PLAYER -->
        <section class="pane" data-tab="player" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Text to Speech</p>
              <h1 data-i18n="playerTitle">Player</h1>
              <p class="sub" data-i18n="playerSub"></p>
            </div>
          </header>
          <div class="rows">
            <div class="row">
              <span data-i18n="position">Position on screen<small id="position-label"></small></span>
              <div class="posgrid" id="position-grid" role="group" aria-label="Player position" data-i18n-aria="positionAria">
                <button type="button" data-pos="top-left" aria-label="Top left" data-i18n-aria="pos.top-left"></button>
                <button type="button" data-pos="top-center" aria-label="Top center" data-i18n-aria="pos.top-center"></button>
                <button type="button" data-pos="top-right" aria-label="Top right" data-i18n-aria="pos.top-right"></button>
                <button type="button" data-pos="middle-left" aria-label="Middle left" data-i18n-aria="pos.middle-left"></button>
                <button type="button" data-pos="center" aria-label="Center" data-i18n-aria="pos.center"></button>
                <button type="button" data-pos="middle-right" aria-label="Middle right" data-i18n-aria="pos.middle-right"></button>
                <button type="button" data-pos="bottom-left" aria-label="Bottom left" data-i18n-aria="pos.bottom-left"></button>
                <button type="button" data-pos="bottom-center" aria-label="Bottom center" data-i18n-aria="pos.bottom-center"></button>
                <button type="button" data-pos="bottom-right" aria-label="Bottom right" data-i18n-aria="pos.bottom-right"></button>
              </div>
            </div>
            <div class="row">
              <span data-i18n="size">Size<small id="size-label"></small></span>
              <span class="seg" role="group" aria-label="Size" data-i18n-aria="size">
                <button type="button" data-size="compact" data-i18n="size.compact">Compact</button>
                <button type="button" data-size="standard" data-i18n="size.standard">Standard</button>
                <button type="button" data-size="spacious" data-i18n="size.spacious">Spacious</button>
              </span>
            </div>
          </div>
        </section>
        <!-- SYSTEM -->
        <section class="pane" data-tab="system" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Text to Speech</p>
              <h1 data-i18n="systemTitle">System</h1>
              <p class="sub" data-i18n="systemSub"></p>
            </div>
          </header>
          <div class="rows">
            <div class="row">
              <span data-i18n="openAtLogin">Open at login<small data-i18n="openAtLoginHint"></small></span>
              <button class="sw" type="button" role="switch" id="auto-launch" aria-checked="false" aria-label="Open at login" data-i18n-aria="openAtLogin"></button>
            </div>
          </div>
        </section>
        <p class="toast" id="status" aria-live="polite"></p>
      </main>
    </div>
  </body>
</html>
